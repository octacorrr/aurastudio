<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraStudio App</title>
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: #00ffff; font-family: system-ui, sans-serif;
      z-index: 9999; background: #02040a;
    }
    #boot p { color: #7da5c2; font-size: 14px; }
  </style>
</head>
<body>
  <div id="boot"><div>AuraStudio</div><p>Cargando suite 3D…</p></div>
  <script>
    (async function () {
      try {
        const loaderUrl = 'https://cdn.jsdelivr.net/gh/octacorrr/aurastudio@bc5ddc9721ec4c7e86093c41ee665f59ce50972f/app.html';
        const res = await fetch(loaderUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        let loader = await res.text();

        // Inyectar parche de micrófono dentro de applyAllPatches del loader estable
        const micPatch = [
          "html = html.replace('let audioCtx, analyser, freqData, timeData, audioSource;',",
          "  'let audioCtx, analyser, freqData, timeData, audioSource;\\n    let micStream = null;');",
          "html = html.replace(",
          "  /getUserMedia\\(\\{ audio: true \\}\\)/,",
          "  'getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })');",
          "html = html.replace(",
          "  'const stream = await navigator.mediaDevices.',",
          "  'micStream = await navigator.mediaDevices.');",
          "html = html.replace(",
          "  'createMediaStreamSource(stream)',",
          "  'createMediaStreamSource(micStream)');",
          "html = html.replace(",
          "  \"statusMessage.textContent = 'En vivo: Micrófono (Procesando EQ & FX)';\",",
          "  \"statusMessage.textContent = 'Mic en vivo · usa auriculares si hay eco';\");",
          "html = html.replace(",
          "  /function stopCurrentSound\\(\\) \\{[\\s\\S]*?^    \\}/m,",
          "  `function stopCurrentSound() {",
          "      if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }",
          "      if (currentPlaybackSource) { try { currentPlaybackSource.stop(); } catch(e){} currentPlaybackSource = null; }",
          "      if (typeof micStream !== 'undefined' && micStream) { try { micStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} micStream = null; }",
          "      if (audioSource) { try { audioSource.disconnect(); } catch(e){} audioSource = null; }",
          "    }`);"
        ].join('\n        ');

        loader = loader.replace(
          'html = html.replace(upOld, upNew);\n      return html;',
          'html = html.replace(upOld, upNew);\n        ' + micPatch + '\n      return html;'
        );

        document.open();
        document.write(loader);
        document.close();
      } catch (e) {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.innerHTML = '<div style="color:#ff6b6b">No se pudo cargar</div>'
            + '<p style="color:#7da5c2;max-width:320px;text-align:center">' + (e && e.message ? e.message : e) + '</p>'
            + '<p><a href="/" style="color:#00ffff">Volver al inicio</a></p>';
        }
      }
    })();
  </script>
</body>
</html>
