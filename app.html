<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AuraStudio App – Visualizador y Ecualizador 3D</title>
  <meta name="description" content="Suite de audio 3D: visualizador WebGL, ecualizador y efectos en el navegador.">
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: #00ffff; font-family: system-ui, sans-serif;
      z-index: 9999; background: #02040a;
    }
    #boot p { color: #7da5c2; font-size: 14px; }
  </style>
</head>
<body>
  <div id="boot">
    <div>AuraStudio</div>
    <p>Cargando suite 3D…</p>
  </div>
  <script>
    (async function () {
      const url = 'https://cdn.jsdelivr.net/gh/octacorrr/aurastudio@f046ed409636ecf6f86633a23daa7112c928cd10/index.html';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        document.open();
        document.write(await res.text());
        document.close();
        setTimeout(function () {
          injectMobileLayoutFix();
          injectHomeLink();
          injectSocialBar();
        }, 500);
      } catch (e) {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.innerHTML =
            '<div style="color:#ff6b6b">No se pudo cargar la app</div>' +
            '<p style="color:#7da5c2;max-width:360px;text-align:center">' + (e && e.message ? e.message : e) +
            '</p><p><a href="/" style="color:#00ffff">Volver al inicio</a></p>';
        }
      }
    })();

    function injectHomeLink() {
      if (document.getElementById('home-link')) return;
      var a = document.createElement('a');
      a.href = '/';
      a.id = 'home-link';
      a.textContent = '← Inicio';
      a.style.cssText = 'position:fixed;top:10px;right:10px;z-index:300;background:rgba(6,14,30,0.95);border:1px solid rgba(0,255,255,0.4);color:#00ffff;padding:8px 12px;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none;font-family:system-ui,sans-serif';
      document.body.appendChild(a);
    }

    function injectSocialBar() {
      if (document.getElementById('adsterra-social-bar')) return;
      var s = document.createElement('script');
      s.id = 'adsterra-social-bar';
      s.src = 'https://pl31300605.profitableratecpmnetwork.com/ea/75/22/ea75223d2edf933c49d42315bebafd78.js';
      document.body.appendChild(s);
    }

    function injectMobileLayoutFix() {
      if (document.getElementById('aura-mobile-fix')) return;

      var css = document.createElement('style');
      css.id = 'aura-mobile-fix';
      css.textContent = [
        '.ad-top-banner, .ad-sidebar-slot { display: none !important; }',

        '@media (max-width: 900px) {',
        '  #nav-tabs {',
        '    top: 10px !important;',
        '    left: 50% !important;',
        '    right: auto !important;',
        '    transform: translateX(-50%) !important;',
        '    max-width: calc(100vw - 100px);',
        '    z-index: 250 !important;',
        '  }',
        '  #nav-tabs .tab-btn { padding: 6px 10px !important; font-size: 11px !important; }',

        '  /* Botón menú: arriba a la izquierda, siempre visible */',
        '  #toggle-panel-btn {',
        '    top: 10px !important;',
        '    left: 10px !important;',
        '    bottom: auto !important;',
        '    z-index: 260 !important;',
        '    width: 42px !important;',
        '    height: 42px !important;',
        '  }',

        '  /* Panel = hoja inferior */',
        '  #sidebar-panel {',
        '    top: auto !important;',
        '    left: 0 !important;',
        '    right: 0 !important;',
        '    bottom: 0 !important;',
        '    width: 100% !important;',
        '    max-width: 100vw !important;',
        '    height: auto !important;',
        '    max-height: 55vh !important;',
        '    border-radius: 16px 16px 0 0 !important;',
        '    border: 1px solid rgba(0,255,255,0.25) !important;',
        '    border-bottom: none !important;',
        '    box-shadow: 0 -8px 30px rgba(0,0,0,0.6) !important;',
        '    transform: translateY(0) !important;',
        '    opacity: 1 !important;',
        '    pointer-events: auto !important;',
        '    z-index: 200 !important;',
        '    transition: transform 0.3s ease, max-height 0.3s ease !important;',
        '    display: flex !important;',
        '    flex-direction: column !important;',
        '    padding-bottom: 12px !important;',
        '  }',

        '  /* Colapsado: solo cabecera visible (~56px) */',
        '  #sidebar-panel.collapsed {',
        '    max-height: 56px !important;',
        '    overflow: hidden !important;',
        '    transform: translateY(0) !important;',
        '    opacity: 1 !important;',
        '    pointer-events: auto !important;',
        '  }',

        '  #sidebar-panel .panel-header {',
        '    flex-shrink: 0;',
        '    cursor: pointer;',
        '    padding: 12px 16px !important;',
        '  }',
        '  #sidebar-panel .panel-content {',
        '    overflow-y: auto !important;',
        '    -webkit-overflow-scrolling: touch;',
        '    flex: 1;',
        '    max-height: none !important;',
        '    padding-bottom: 8px;',
        '  }',

        '  #status-bar {',
        '    bottom: 62px !important;',
        '    z-index: 180 !important;',
        '    font-size: 11px !important;',
        '  }',
        '  #sidebar-panel.collapsed ~ #status-bar,',
        '  body:has(#sidebar-panel.collapsed) #status-bar {',
        '    bottom: 62px !important;',
        '  }',
        '}',

        '@media (min-width: 901px) {',
        '  .ad-top-banner { display: none !important; }',
        '  #sidebar-panel { max-height: calc(100vh - 40px); }',
        '}'
      ].join('\n');
      document.head.appendChild(css);

      var btn = document.getElementById('toggle-panel-btn');
      var panel = document.getElementById('sidebar-panel');
      if (!panel) return;

      // Móvil: empezar colapsado
      if (window.innerWidth <= 900) {
        panel.classList.add('collapsed');
      }

      function togglePanel() {
        panel.classList.toggle('collapsed');
      }

      if (btn) {
        btn.onclick = function (e) {
          e.preventDefault();
          e.stopPropagation();
          togglePanel();
        };
      }

      // Tocar la cabecera del panel también abre/cierra
      var header = panel.querySelector('.panel-header');
      if (header) {
        header.addEventListener('click', function () {
          if (window.innerWidth <= 900) togglePanel();
        });
      }

      // Barra extra "Controles" si el panel está colapsado y no se nota
      if (window.innerWidth <= 900 && !document.getElementById('aura-open-controls')) {
        var openBtn = document.createElement('button');
        openBtn.id = 'aura-open-controls';
        openBtn.type = 'button';
        openBtn.textContent = '▲ Controles';
        openBtn.style.cssText = [
          'position:fixed', 'left:50%', 'transform:translateX(-50%)',
          'bottom:8px', 'z-index:220',
          'background:rgba(0,255,255,0.15)', 'border:1px solid rgba(0,255,255,0.5)',
          'color:#00ffff', 'padding:8px 18px', 'border-radius:20px',
          'font-size:13px', 'font-weight:700', 'font-family:system-ui,sans-serif',
          'backdrop-filter:blur(8px)'
        ].join(';');
        openBtn.onclick = function () {
          panel.classList.remove('collapsed');
          openBtn.style.display = 'none';
        };
        document.body.appendChild(openBtn);

        // Mostrar/ocultar según estado del panel
        var obs = new MutationObserver(function () {
          openBtn.style.display = panel.classList.contains('collapsed') ? 'block' : 'none';
        });
        obs.observe(panel, { attributes: true, attributeFilter: ['class'] });
      }
    }
  </script>
</body>
</html>
