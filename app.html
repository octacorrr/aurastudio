<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraStudio App – Visualizador y Ecualizador 3D</title>
  <meta name="description" content="Suite de audio 3D: visualizador WebGL, ecualizador y efectos en el navegador.">
  <style>
    html, body { margin: 0; height: 100%; background: #02040a; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; color: #00ffff; font-family: system-ui, sans-serif;
      z-index: 9999; background: #02040a;
    }
    #boot p { color: #7da5c2; font-size: 14px; }
    #home-link {
      position: fixed; top: 16px; right: 16px; z-index: 10000;
      background: rgba(6,14,30,0.9); border: 1px solid rgba(0,255,255,0.35);
      color: #00ffff; padding: 8px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 600; text-decoration: none; backdrop-filter: blur(10px);
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <a href="/" id="home-link">← Inicio</a>
  <div id="boot">
    <div>AuraStudio</div>
    <p>Cargando suite 3D…</p>
  </div>
  <script>
    // Carga la app completa desde el commit estable del repo (HTML autocontenido)
    (async function () {
      const url = 'https://cdn.jsdelivr.net/gh/octacorrr/aurastudio@f046ed409636ecf6f86633a23daa7112c928cd10/index.html';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        let html = await res.text();
        // Quitar el documento exterior e inyectar en la página actual
        // Mejor: reemplazar todo el documento
        document.open();
        document.write(html);
        document.close();
        // Re-inyectar enlace a inicio tras el rewrite
        setTimeout(function () {
          if (!document.getElementById('home-link')) {
            var a = document.createElement('a');
            a.href = '/';
            a.id = 'home-link';
            a.textContent = '← Inicio';
            a.style.cssText = 'position:fixed;top:16px;right:16px;z-index:120;background:rgba(6,14,30,0.9);border:1px solid rgba(0,255,255,0.35);color:#00ffff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600;text-decoration:none;backdrop-filter:blur(10px);font-family:system-ui,sans-serif';
            document.body.appendChild(a);
          }
        }, 800);
      } catch (e) {
        document.getElementById('boot').innerHTML =
          '<div style="color:#ff6b6b">No se pudo cargar la app</div>' +
          '<p style="color:#7da5c2;max-width:360px;text-align:center">' + e.message +
          '</p><p><a href="/" style="color:#00ffff">Volver al inicio</a></p>';
      }
    })();
  </script>
</body>
</html>
